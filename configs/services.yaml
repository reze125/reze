# ========== INFRASTRUCTURE ==========
infrastructure:
  docker_host:
    type: "server"
    name: "main-server"
    health_checks:
      - metric: "disk_usage"
        threshold: 85
        unit: "%"
      - metric: "memory_usage"
        threshold: 80
        unit: "%"
      - metric: "cpu_load"
        threshold: 90
        unit: "%"
    auto_actions:
      disk_high: "clean_docker_images_and_logs"
      memory_high: "identify_and_restart_leaky_containers"
      cpu_high: "analyze_and_throttle"
    monitoring_commands:
      disk: "df -h /"
      memory: "free -m"
      cpu: "top -bn1 | head -5"

  nginx:
    type: "reverse_proxy"
    config_path: "/etc/nginx/sites-enabled/"
    health_url: "http://localhost:80"
    ssl_certs:
      - "*.runstate.dev"
      - "aitoolslab.com"
      - "nocodetoolslab.com"
    auto_actions:
      cert_expiring: "auto_renew_certbot"
      config_error: "rollback_and_alert"
    health_check_command: "nginx -t"

  postgresql:
    type: "database"
    port: 5433
    health_check: "pg_isready -p 5433"
    auto_actions:
      connection_pool_high: "analyze_and_optimize_queries"
      backup_overdue: "trigger_backup"
      slow_queries: "analyze_and_index"
    monitoring_commands:
      connections: "SELECT count(*) FROM pg_stat_activity"
      size: "SELECT pg_size_pretty(pg_database_size('postgres'))"

  redis:
    type: "cache"
    port: 6379
    health_check: "redis-cli ping"
    auto_actions:
      memory_high: "flush_old_keys"

  n8n:
    type: "workflow"
    url: "http://localhost:5678"
    health_url: "http://localhost:5678/healthz"
    api_key_env: "N8N_API_KEY"
    auto_actions:
      workflow_failed: "analyze_and_retry"
      execution_stuck: "cancel_and_restart"


# ========== AGENT MONITORING ==========
agent_types:
  docker_container:
    check: "docker inspect --format='{{.State.Status}}' {name}"
    healthy: "running"
    restart: "docker restart {name}"
    max_auto_restarts: 3

  n8n_workflow:
    check: "curl -s http://localhost:5678/api/v1/workflows/{id}"
    healthy_field: "active"
    activate: "curl -X PATCH http://localhost:5678/api/v1/workflows/{id}/activate"

  pm2_process:
    check: "pm2 jlist"
    healthy: "online"
    restart: "pm2 restart {name}"
    max_auto_restarts: 3

  cron_job:
    check: "grep '{pattern}' /var/log/syslog | tail -1"
    healthy: "last_run within expected_interval"

  dify_app:
    check: "curl -s http://localhost:3000/api/apps/{id}/status"
    healthy_field: "status"
    healthy_value: "active"


